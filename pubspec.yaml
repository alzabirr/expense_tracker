name: spendra
description: "Momentum — Premium offline-first expense tracker"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: '>=3.22.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # State Management
  flutter_riverpod: ^2.5.1

  # Navigation
  go_router: ^14.2.7

  # Database
  isar: ^3.1.0+1
  isar_flutter_libs: ^3.1.0+1

  # Models (immutable entities)
  freezed_annotation: ^2.4.1
  json_annotation: ^4.9.0

  # UI & Fonts
  google_fonts: ^6.2.1
  fl_chart: ^0.69.0
  animations: ^2.0.11

  # Utils
  intl: ^0.19.0
  path_provider: ^2.1.3
  jni: ^0.10.0
  share_plus: ^10.1.4
  uuid: ^4.4.2
  file_picker: ^8.1.4
  supabase_flutter: ^2.17.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

  # Code Generation
  build_runner: ^2.4.11
  freezed: ^2.5.2
  json_serializable: ^6.8.0
  isar_generator: ^3.1.0+1

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
